name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p dist
          version="${VERSION#v}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            binary="rts"
            extension="tar.gz"
            if [ "$os" = windows ]; then
              binary="rts.exe"
              extension="zip"
            fi
            archive="rts_${version}_${os}_${arch}.${extension}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/Inzaniak/rts/internal/buildinfo.Version=$VERSION -X github.com/Inzaniak/rts/internal/buildinfo.Commit=$COMMIT -X github.com/Inzaniak/rts/internal/buildinfo.Date=$build_date" \
              -o "$binary" ./cmd/rts
            if [ "$os" = windows ]; then
              zip -q "dist/$archive" "$binary"
            else
              tar -czf "dist/$archive" "$binary"
            fi
          done
          cd dist
          sha256sum rts_* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
